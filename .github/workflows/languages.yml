name: Update languages card

on:
  schedule:
    - cron: "37 5 * * *" # todos los días
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/languages.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Fetch languages
        env:
          # Para contar también repos privados, crea el secreto LANGS_TOKEN
          # con un token personal que pueda leer tus repos.
          GH_TOKEN: ${{ secrets.LANGS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_languages.py

      - name: Build SVGs
        run: python3 scripts/build_readme_assets.py

      - name: Commit changes
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update languages card"
          git push
